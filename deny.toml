# cargo-deny: run `cargo deny check` (CI does). NFR-SEC-051.

[graph]
all-features = true

[advisories]
# Fail on any crate with a RustSec security advisory. Unmaintained crates only
# fail when they're our direct dependencies.
unmaintained = "workspace"

[licenses]
# Klotho is MIT. These licences are all compatible with that and with shipping
# a single binary. Anything new fails CI until it's added here on purpose.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki root certificate data
    "ISC",
    "MIT",
    "MPL-2.0",             # file-level copyleft: fine as long as we don't modify the crate's files
    "Unicode-3.0",
    "Unicode-DFS-2016",    # finl_unicode (via comrak); the older form of Unicode-3.0
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are allowed (common during upgrades) but shown.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version, which is fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
