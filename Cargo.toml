[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/git",
    "crates/klotho",
    "crates/server",
    "crates/ssh",
    "crates/web",
    "xtask",
]

[workspace.package]
rust-version = "1.98.1"
license = "MIT"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
klotho-core = { path = "crates/core" }
klotho-git = { path = "crates/git" }
klotho-server = { path = "crates/server" }
klotho-ssh = { path = "crates/ssh" }
klotho-web = { path = "crates/web" }
anyhow = "1.0.104"
async-compression = "0.4.49"
axum = "0.8.9"
futures-util = "0.3.34"
gix = "0.87"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.1"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
