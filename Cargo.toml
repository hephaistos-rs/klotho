[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/git",
    "crates/klotho",
    "crates/server",
    "crates/ssh",
    "crates/web",
    "xtask",
]

[workspace.package]
rust-version = "1.98.1"
license = "MIT"
version = "0.1.0"
edition = "2024"
# Klotho ships as a binary, not as crates on crates.io.
publish = false

[workspace.dependencies]
klotho-core = { path = "crates/core" }
klotho-git = { path = "crates/git" }
klotho-server = { path = "crates/server" }
klotho-ssh = { path = "crates/ssh" }
klotho-web = { path = "crates/web" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
mime_guess = "2.0.5"
rust-embed = "8.12.0"
tempfile = "3.27.0"
topcoat = { version = "=0.9.0", default-features = false }
tower = "0.5"
tower-http = "0.7.1"
async-compression = "0.4.49"
axum = "0.8.9"
futures-util = "0.3.34"
gix = "0.87"
# Must be the exact gix-pack that gix uses, so Cargo merges the `generate`
# feature (pack writing, which gix doesn't enable) into that same crate.
gix-pack = { version = "=0.74.2", default-features = false, features = ["generate"] }
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = "1.53.1"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
