[package]
name = "klotho-web"
rust-version.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
klotho-core.workspace = true
# For streaming a raw file through a Topcoat route.
bytes.workspace = true
http-body.workspace = true
jiff.workspace = true
serde.workspace = true
# `default` is Topcoat's router, sessions, cookies, assets, fonts, icons and
# runtime, which the UI is built on (ADR 0002). `ui` is the component
# registry, `icon-iconify` the icon sets (ADR 0005).
topcoat = { workspace = true, features = ["default", "tailwind", "tower", "ui", "icon-iconify"] }
tracing.workspace = true

[build-dependencies]
topcoat = { workspace = true, features = ["tailwind", "icon-iconify"] }
