[package]
name = "klotho-server"
rust-version.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Serve the web UI's asset bundle from inside the binary. Set by `cargo xtask dist`,
# which also points KLOTHO_ASSETS_DIR at the bundle (ADR 0002). The feature lives
# here, not in klotho-web, so turning it on doesn't change klotho-web's build and
# with it the asset IDs.
embed-assets = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
klotho-core.workspace = true
klotho-git.workspace = true
klotho-web.workspace = true
anyhow.workspace = true
async-compression = { workspace = true, features = ["tokio", "gzip"] }
axum.workspace = true
futures-util.workspace = true
mime_guess = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true, features = ["interpolate-folder-path", "debug-embed"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net", "signal", "time"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tower.workspace = true
tower-http = { workspace = true, features = ["limit", "request-id", "timeout", "trace", "util"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
