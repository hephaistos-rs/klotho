[package]
name = "klotho-server"
rust-version.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

# Release builds embed the web UI's asset bundle when KLOTHO_ASSETS_DIR is set
# (see build.rs and ADR 0002). That's deliberately not a Cargo feature: a feature
# changes dependency resolution for the whole build, which changes klotho-web's
# build and with it every asset ID. rust-embed and mime_guess are always compiled
# so both build passes resolve exactly the same dependencies.

[dependencies]
klotho-core.workspace = true
klotho-git.workspace = true
klotho-web.workspace = true
async-compression = { workspace = true, features = ["tokio", "gzip"] }
axum.workspace = true
futures-util.workspace = true
jiff.workspace = true
mime_guess.workspace = true
rust-embed = { workspace = true, features = ["interpolate-folder-path", "debug-embed"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal", "time"] }
tokio-util = { workspace = true, features = ["io", "io-util", "rt"] }
tower.workspace = true
tower-http = { workspace = true, features = ["limit", "request-id", "timeout", "trace", "util"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
