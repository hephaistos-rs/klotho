[alias]
xtask = "run --package xtask --"

# `cargo run` uses the development config. This applies only to commands run
# through Cargo, and a KLOTHO_CONFIG already set in your shell takes precedence.
# `relative = true` resolves the path against the repository root, so it doesn't
# matter which folder you run from.
[env]
KLOTHO_CONFIG = { value = "klotho.dev.toml", relative = true }
